[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fed-gbm"
version = "3.0.0"
description = "Privacy-Preserving Federated Learning for Glioblastoma Prognosis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
    "matplotlib>=3.8.0",
    "nibabel>=5.0.0",
    "lifelines>=0.28.0",
    "shap>=0.45.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
extraPaths = [".", "src"]

